# Local Docker only. The default IntelliJ configuration stays unchanged.
spring.datasource.url=jdbc:postgresql://db:5432/dental_clinic
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
app.cookie.secure=false
app.cookie.same-site=Lax
app.public-base-url=
app.ai.vector-store-path=/app/data/vectorstore.json
server.forward-headers-strategy=framework
