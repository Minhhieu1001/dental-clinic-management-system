# Application
spring.application.name=backend
server.port=${PORT:8080}

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dental_clinic}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update

# Bound background customer-care SMTP calls.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# SQL Initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# PostgreSQL Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# JWT & Security Configuration
# ===============================

# Base64 encoded secret key for signing JWT tokens (HMAC-SHA256 requires >= 256 bits)
app.jwt.secret=${JWT_SECRET}

# Access Token Expiration (15 minutes = 900000 ms)
app.jwt.access-token-expiration-ms=900000

# Refresh Token Expiration (7 days = 604800000 ms)
app.jwt.refresh-token-expiration-ms=604800000

# Cookie Configuration
app.cookie.domain=localhost
app.cookie.secure=false
app.cookie.same-site=Lax

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Upload file
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:false}

# SMS Brandname Configuration
app.sms.provider=${SMS_PROVIDER:mock}
app.sms.api-key=${SMS_API_KEY:}
app.sms.secret-key=${SMS_SECRET_KEY:}
app.sms.brandname=${SMS_BRANDNAME:0343632524}

# Clinic payment QR configuration
app.clinic.bank-id=${APP_CLINIC_BANK_ID}
app.clinic.account-no=${APP_CLINIC_ACCOUNT_NO}
app.clinic.account-name=${APP_CLINIC_ACCOUNT_NAME}
app.clinic.qr-template=${APP_CLINIC_QR_TEMPLATE}

# Cau hinh Spring AI Google Gemini
spring.ai.google.genai.api-key=${AI_API_KEY:AQ.Ab8RN6LaSxSr5Y_t5maY9jvY88ym1ao5o3axtfgxP2G74Z_jFA}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
spring.ai.google.genai.embedding.api-key=${AI_API_KEY:AQ.Ab8RN6LaSxSr5Y_t5maY9jvY88ym1ao5o3axtfgxP2G74Z_jFA}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001

# Cau hinh AI X-ray Vision Model (Mô hình Gemini 3.5 Flash xử lý đa phương thức tốc độ cao)
app.ai.xray.model=gemini-3.5-flash
app.ai.xray.fallback-model=gemini-3.5-flash-lite
app.ai.xray.triage-model=gemini-3.5-flash-lite
app.ai.xray.tile-model=gemini-3.5-flash
app.ai.xray.tiling-enabled=false
app.ai.xray.timeout-seconds=45
app.ai.xray.max-image-side=1400
app.ai.xray.thinking-budget=2048


# RabbitMQ Configuration
spring.rabbitmq.addresses=${SPRING_RABBITMQ_ADDRESSES:}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:dental}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:dental_local_only}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}
# Giới hạn số lượng xử lý cùng lúc (mỗi consumer nhận 1-3 message một lúc để tránh spam mail)
spring.rabbitmq.listener.simple.prefetch=1
# Phòng vệ: không làm sập server nếu RabbitMQ gặp sự cố kết nối lúc khởi động
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_AUTO_STARTUP:true}


# Cấu hình In-Memory Cache (Caffeine trên RAM)
spring.cache.type=caffeine

spring.cache.caffeine.spec=maximumSize=2000,expireAfterWrite=60m

# Logging
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=ERROR

# Exclude AI vectorstore from triggering DevTools restart loop
spring.devtools.restart.exclude=**/ai/document/**,**/vectorstore.json

# ===============================
# Cấu hình Resilience4j (Circuit Breaker & Retry)
# ===============================
# 1. Circuit Breaker cho Gemini AI
resilience4j.circuitbreaker.instances.geminiAi.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.geminiAi.sliding-window-size=10
resilience4j.circuitbreaker.instances.geminiAi.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.geminiAi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.geminiAi.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.geminiAi.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.geminiAi.automatic-transition-from-open-to-half-open-enabled=true

# 2. Retry cho Gemini AI
resilience4j.retry.instances.geminiAi.max-attempts=2
resilience4j.retry.instances.geminiAi.wait-duration=1500ms
resilience4j.retry.instances.geminiAi.enable-exponential-backoff=true
resilience4j.retry.instances.geminiAi.exponential-backoff-multiplier=2

# 3. Circuit Breaker cho Email Service
resilience4j.circuitbreaker.instances.emailService.sliding-window-size=10
resilience4j.circuitbreaker.instances.emailService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.emailService.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.emailService.wait-duration-in-open-state=60s

# 4. Retry cho Email Service
resilience4j.retry.instances.emailService.max-attempts=3
resilience4j.retry.instances.emailService.wait-duration=1000ms
resilience4j.retry.instances.emailService.enable-exponential-backoff=true
resilience4j.retry.instances.emailService.exponential-backoff-multiplier=2


# Cấu hình Resilience4j RateLimiter (Chống spam API)

# 5. RateLimiter cho Chatbot AI (Tối đa 6 câu hỏi / 1 phút)
resilience4j.ratelimiter.instances.aiChatLimiter.limit-for-period=10
resilience4j.ratelimiter.instances.aiChatLimiter.limit-refresh-period=1m
resilience4j.ratelimiter.instances.aiChatLimiter.timeout-duration=0s

# 6. RateLimiter cho Yêu cầu đặt lịch (Tối đa 3 yêu cầu / 1 phút)
resilience4j.ratelimiter.instances.appointmentRequestLimiter.limit-for-period=10
resilience4j.ratelimiter.instances.appointmentRequestLimiter.limit-refresh-period=1m
resilience4j.ratelimiter.instances.appointmentRequestLimiter.timeout-duration=0s

# 7. RateLimiter cho Đặt lịch hẹn trực tiếp (Tối đa 4 lịch hẹn / 1 phút)
resilience4j.ratelimiter.instances.appointmentBookingLimiter.limit-for-period=10
resilience4j.ratelimiter.instances.appointmentBookingLimiter.limit-refresh-period=1m
resilience4j.ratelimiter.instances.appointmentBookingLimiter.timeout-duration=0s

# 8. RateLimiter cho Đăng nhập (Tối đa 5 lần đăng nhập / 1 phút)
resilience4j.ratelimiter.instances.loginLimiter.limit-for-period=5
resilience4j.ratelimiter.instances.loginLimiter.limit-refresh-period=1m
resilience4j.ratelimiter.instances.loginLimiter.timeout-duration=0s

# Customer care delivery: RabbitMQ with bounded consumers.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.concurrency=2
spring.rabbitmq.listener.simple.max-concurrency=2
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=false
spring.rabbitmq.connection-timeout=3s
