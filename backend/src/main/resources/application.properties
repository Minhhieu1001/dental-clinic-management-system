# Application
spring.application.name=backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/dental_clinic
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL Initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# PostgreSQL Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# JWT & Security Configuration
# ===============================

# Base64 encoded secret key for signing JWT tokens (HMAC-SHA256 requires >= 256 bits)
app.jwt.secret=4qQYqL2aZ9Xz8wE7cT3vB6hN1mK5jP0rF4sU7xV2yH9=

# Access Token Expiration (15 minutes = 900000 ms)
app.jwt.access-token-expiration-ms=900000

# Refresh Token Expiration (7 days = 604800000 ms)
app.jwt.refresh-token-expiration-ms=604800000

# Cookie Configuration
app.cookie.domain=localhost
app.cookie.secure=false
app.cookie.same-site=Lax